name: Build Azure image
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to dedicated registry
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: az acr login --name "$REGISTRY"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.AZURE_REGISTRY }}.azurecr.io/telecom:${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image
        env:
          IMAGE: ${{ vars.AZURE_REGISTRY }}.azurecr.io/telecom@${{ steps.build.outputs.digest }}
        run: python -c 'import json,os; json.dump({"image":os.environ["IMAGE"]},open("cloud-image.json","w"))'
      - uses: actions/upload-artifact@v4
        with:
          name: azure-image
          path: cloud-image.json
