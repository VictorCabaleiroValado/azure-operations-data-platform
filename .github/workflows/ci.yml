name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python scripts/bootstrap_demo.py && python scripts/verify_frontend.py
      - run: node scripts/check_csv.mjs
      - run: docker build -t telecom:test .
      - name: Container liveness
        run: |
          docker run -d --name telecom-test -p 8000:8000 telecom:test
          for i in $(seq 1 30); do
            if curl --fail http://localhost:8000/health/live; then exit 0; fi
            sleep 2
          done
          docker logs telecom-test
          exit 1
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep
      - run: az bicep build --file infra/budget.bicep
