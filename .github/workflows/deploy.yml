name: Deploy Azure
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Public container image pinned to @sha256 digest'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-telecom-deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment: azure-portfolio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable image input
        env:
          IMAGE: ${{ inputs.image }}
        run: '[[ "$IMAGE" =~ ^[a-z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview and deploy dedicated project group
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ inputs.image }}
        run: |
          az deployment group what-if --resource-group "$RG" --template-file infra/main.bicep --parameters image="$IMAGE"
          az deployment group create --resource-group "$RG" --template-file infra/main.bicep --parameters image="$IMAGE" deployApi=false --output none
      - name: Start ingestion
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          execution=$(az containerapp job start --name telecom-pipeline --resource-group "$RG" --query name -o tsv)
          for i in $(seq 1 180); do
            status=$(az containerapp job execution show --name telecom-pipeline --job-execution-name "$execution" --resource-group "$RG" --query properties.status -o tsv)
            if [ "$status" = Succeeded ]; then exit 0; fi
            if [ "$status" = Failed ]; then exit 1; fi
            sleep 10
          done
          echo 'Ingestion did not succeed within the verification window.'
          exit 1
      - name: Deploy API after first valid data release
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE: ${{ inputs.image }}
        run: |
          url=$(az deployment group create --resource-group "$RG" --template-file infra/main.bicep --parameters image="$IMAGE" deployApi=true --query properties.outputs.appUrl.value -o tsv)
          curl --fail --retry 8 --retry-all-errors "$url/health/ready"
          curl --fail "$url/api/metadata" > cloud-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-verification
          path: cloud-metadata.json
